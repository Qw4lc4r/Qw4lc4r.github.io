<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --accent: #ffdb4d; --bg: #1a1a1a; }
        body {
            background: linear-gradient(180deg, #1e3c72 0%, #1a1a1a 100%);
            color: white;
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 15px;
            height: 100vh; overflow: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        #error-log { color: #ff5252; font-size: 10px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="city-title">Engels / Hourly</h1>
        </div>
        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>
        <div id="error-log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        try {
            const urlParams = new URLSearchParams(window.location.search);
            const temps = JSON.parse(decodeURIComponent(urlParams.get('temps') || '[]'));
            const labels = JSON.parse(decodeURIComponent(urlParams.get('labels') || '[]'));

            if (temps.length === 0) {
                document.getElementById('error-log').innerText = "Данные не загружены. Отправьте город боту.";
            }

            const ctx = document.getElementById('weatherChart').getContext('2d');
            
            // Создаем градиент для линии
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(255, 219, 77, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 219, 77, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: temps,
                        borderColor: '#ffdb4d',
                        borderWidth: 3,
                        pointBackgroundColor: '#ffdb4d',
                        pointRadius: 4,
                        pointHoverRadius: 8, // Точка увеличивается при наведении
                        pointHitRadius: 20,  // Легче попасть пальцем
                        tension: 0.4,
                        fill: true,
                        backgroundColor: gradient
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false, // Тултип появляется, даже если не попали ровно в точку
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            titleColor: '#000',
                            bodyColor: '#000',
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + '°C';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { 
                                color: 'rgba(255,255,255,0.6)',
                                font: { size: 10 },
                                maxTicksLimit: 8 // Чтобы не забивать экран на мобильном
                            }
                        },
                        y: {
                            display: false, // Прячем шкалу Y для красоты, цифры будут в тултипах
                            grid: { display: false }
                        }
                    }
                }
            });
        } catch (e) {
            document.getElementById('error-log').innerText = "Ошибка: " + e.message;
        }
    </script>
</body>
</html>
