<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Weather TMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --tg-bg: linear-gradient(180deg, #354f66 0%, #51799c 100%); }
        body {
            background: var(--tg-bg);
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .night-theme { --tg-bg: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%); }
        
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            transition: 0.3s;
        }
        .search-input:focus { background: rgba(255, 255, 255, 0.2); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: slideUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="p-4 space-y-5 pb-12">

    <!-- Search & Location -->
    <div class="relative z-[100] animate-up" style="animation-delay: 0.1s">
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 opacity-50"></i>
                <input type="text" id="city-input" placeholder="Город или район..." 
                    class="w-full pl-10 pr-4 py-3 rounded-2xl search-input text-sm" autocomplete="off">
            </div>
            <button onclick="getLocation()" class="glass px-4">
                <i data-lucide="map-pin" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="suggestions" class="absolute w-full mt-2 glass hidden overflow-hidden z-[110]"></div>
    </div>

    <!-- Main Banner (Как на Яндекс.Погоде) -->
    <section class="text-center animate-up" style="animation-delay: 0.2s">
        <h1 id="city-name" class="text-3xl font-bold mb-1">...</h1>
        <p id="date-label" class="text-xs opacity-70 mb-6 uppercase tracking-widest font-semibold"></p>
        
        <div class="flex justify-center items-center gap-6 mb-4">
             <i id="main-icon" data-lucide="sun" class="w-32 h-32 text-white drop-shadow-xl"></i>
             <div class="text-left">
                <h2 id="current-temp" class="text-7xl font-light tracking-tighter">--°</h2>
                <p id="weather-desc" class="text-xl font-medium opacity-90 mt-1">Загрузка...</p>
             </div>
        </div>
        
        <div class="glass inline-flex gap-4 px-6 py-2 text-sm font-medium">
            <span>Ощущается как <b id="feels-like">--°</b></span>
        </div>
    </section>

    <!-- Hourly Scroll -->
    <div class="glass p-5 animate-up" style="animation-delay: 0.3s">
        <h3 class="text-[10px] uppercase tracking-widest opacity-60 mb-4 font-bold flex justify-between">
            <span>Прогноз на 24 часа</span>
            <span id="precip-prob" class="text-blue-200">Осадки: 0%</span>
        </h3>
        <div id="hourly-scroll" class="flex overflow-x-auto gap-6 hide-scroll">
            <!-- JS dynamic content -->
        </div>
    </div>

    <!-- Stats Grid (Максимум информации) -->
    <div class="grid grid-cols-2 gap-4 animate-up" style="animation-delay: 0.4s">
        <div class="glass p-4">
            <div class="flex items-center gap-2 opacity-50 text-[10px] font-bold uppercase mb-2">
                <i data-lucide="wind" class="w-3 h-3"></i> Ветер
            </div>
            <p id="wind-speed" class="text-xl font-bold">-- <span class="text-xs font-normal">м/с</span></p>
            <p id="wind-dir" class="text-[10px] opacity-60 mt-1 italic"></p>
        </div>
        <div class="glass p-4">
            <div class="flex items-center gap-2 opacity-50 text-[10px] font-bold uppercase mb-2">
                <i data-lucide="droplets" class="w-3 h-3"></i> Влажность
            </div>
            <p id="humidity" class="text-xl font-bold">--%</p>
            <p id="dew-point" class="text-[10px] opacity-60 mt-1">Т. росы: --°</p>
        </div>
        <div class="glass p-4">
            <div class="flex items-center gap-2 opacity-50 text-[10px] font-bold uppercase mb-2">
                <i data-lucide="gauge" class="w-3 h-3"></i> Давление
            </div>
            <p id="pressure" class="text-xl font-bold">--</p>
            <p class="text-[10px] opacity-60 mt-1 font-light">мм рт. ст.</p>
        </div>
        <div class="glass p-4 text-sm">
            <div class="flex items-center gap-2 opacity-50 text-[10px] font-bold uppercase mb-2">
                <i data-lucide="sun" class="w-3 h-3"></i> УФ-индекс
            </div>
            <p id="uv-index" class="text-xl font-bold">--</p>
            <p id="uv-desc" class="text-[10px] opacity-60 mt-1 italic"></p>
        </div>
    </div>

    <!-- Visibility & Clouds -->
    <div class="glass p-5 animate-up" style="animation-delay: 0.5s">
        <div class="flex justify-around items-center text-center">
            <div>
                <p class="text-[10px] opacity-50 uppercase font-bold mb-1">Видимость</p>
                <p id="visibility" class="text-lg font-bold">-- км</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div>
                <p class="text-[10px] opacity-50 uppercase font-bold mb-1">Облачность</p>
                <p id="cloud-cover" class="text-lg font-bold">--%</p>
            </div>
        </div>
    </div>

    <!-- Weekly Forecast (Table style) -->
    <div class="glass p-6 animate-up" style="animation-delay: 0.6s">
        <h3 class="text-[10px] uppercase tracking-widest opacity-60 mb-6 font-bold">Прогноз на 7 дней</h3>
        <div id="forecast-list" class="space-y-6">
            <!-- JS -->
        </div>
    </div>

    <script>
        const weatherCodes = {
            0: { desc: 'Ясно', icon: 'sun' },
            1: { desc: 'Почти ясно', icon: 'cloud-sun' },
            2: { desc: 'Облачно', icon: 'cloud' },
            3: { desc: 'Пасмурно', icon: 'cloudy' },
            45: { desc: 'Туман', icon: 'cloud-fog' },
            61: { desc: 'Небольшой дождь', icon: 'cloud-rain' },
            71: { desc: 'Снег', icon: 'snowflake' },
            95: { desc: 'Гроза', icon: 'cloud-lightning' }
        };

        const input = document.getElementById('city-input');
        const suggestionsBox = document.getElementById('suggestions');

        input.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) { suggestionsBox.classList.add('hidden'); return; }
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(() => fetchSuggestions(query), 400);
        });

        async function fetchSuggestions(query) {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ru&format=json`);
            const data = await res.json();
            if (data.results) showSuggestions(data.results);
        }

        function showSuggestions(results) {
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.remove('hidden');
            results.forEach(city => {
                const div = document.createElement('div');
                div.className = 'p-4 border-b border-white/5 active:bg-white/10 cursor-pointer';
                div.innerHTML = `<div class="text-sm font-bold">${city.name}</div><div class="text-[10px] opacity-50">${city.country}</div>`;
                div.onclick = () => {
                    input.value = city.name;
                    suggestionsBox.classList.add('hidden');
                    updateUI(city.latitude, city.longitude, city.name);
                };
                suggestionsBox.appendChild(div);
            });
        }

        async function updateUI(lat, lon, name) {
            document.getElementById('city-name').innerText = name;
            localStorage.setItem('last_city', JSON.stringify({lat, lon, name}));
            
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover,visibility&hourly=temperature_2m,weather_code,precipitation_probability,dew_point_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto`;
            
            const res = await fetch(url);
            const data = await res.json();

            // Theme & Header
            document.body.className = data.current.is_day ? 'p-4 space-y-5 pb-12' : 'p-4 space-y-5 pb-12 night-theme';
            document.getElementById('date-label').innerText = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

            // Main Metrics
            document.getElementById('current-temp').innerText = Math.round(data.current.temperature_2m) + '°';
            document.getElementById('feels-like').innerText = Math.round(data.current.apparent_temperature) + '°';
            document.getElementById('humidity').innerText = data.current.relative_humidity_2m + '%';
            document.getElementById('wind-speed').innerText = data.current.wind_speed_10m.toFixed(1);
            document.getElementById('pressure').innerText = Math.round(data.current.surface_pressure * 0.750062);
            document.getElementById('visibility').innerText = (data.current.visibility / 1000).toFixed(0);
            document.getElementById('cloud-cover').innerText = data.current.cloud_cover;
            document.getElementById('uv-index').innerText = data.daily.uv_index_max[0].toFixed(0);
            document.getElementById('dew-point').innerText = Math.round(data.hourly.dew_point_2m[0]);
            
            const wInfo = weatherCodes[data.current.weather_code] || { desc: 'Облачно', icon: 'cloud' };
            document.getElementById('weather-desc').innerText = wInfo.desc;
            document.getElementById('main-icon').setAttribute('data-lucide', wInfo.icon);

            // Hourly
            const hBox = document.getElementById('hourly-scroll');
            hBox.innerHTML = '';
            data.hourly.time.slice(0, 24).forEach((time, i) => {
                const hour = time.split('T')[1];
                const icon = weatherCodes[data.hourly.weather_code[i]]?.icon || 'cloud';
                const prob = data.hourly.precipitation_probability[i];
                hBox.innerHTML += `
                    <div class="text-center min-w-[50px] space-y-2">
                        <p class="text-[10px] opacity-50">${hour}</p>
                        <i data-lucide="${icon}" class="w-5 h-5 mx-auto"></i>
                        <p class="text-sm font-bold">${Math.round(data.hourly.temperature_2m[i])}°</p>
                        <p class="text-[9px] text-blue-200 font-medium">${prob > 0 ? prob + '%' : ''}</p>
                    </div>`;
            });

            // Weekly
            const wList = document.getElementById('forecast-list');
            wList.innerHTML = '';
            for(let i = 0; i < 7; i++) {
                const date = new Date(data.daily.time[i]);
                const dayName = i === 0 ? 'Сегодня' : date.toLocaleDateString('ru-RU', { weekday: 'short' });
                const icon = weatherCodes[data.daily.weather_code[i]]?.icon || 'cloud';
                wList.innerHTML += `
                    <div class="flex justify-between items-center text-sm">
                        <span class="w-16 capitalize opacity-80">${dayName}</span>
                        <i data-lucide="${icon}" class="w-5 h-5 text-blue-200"></i>
                        <div class="flex-1 mx-6 h-1 bg-white/10 rounded-full relative overflow-hidden">
                             <div class="absolute h-full bg-white/40" style="left:30%; width:40%"></div>
                        </div>
                        <span class="w-20 text-right font-bold text-base">${Math.round(data.daily.temperature_2m_max[i])}° <span class="opacity-30 font-normal text-sm ml-1">${Math.round(data.daily.temperature_2m_min[i])}°</span></span>
                    </div>`;
            }

            lucide.createIcons();
        }

        async function getLocation() {
            navigator.geolocation.getCurrentPosition(
                (pos) => updateUI(pos.coords.latitude, pos.coords.longitude, "Текущее место"),
                () => alert("Разрешите GPS для локального прогноза")
            );
        }

        const saved = localStorage.getItem('last_city');
        if (saved) {
            const c = JSON.parse(saved);
            updateUI(c.lat, c.lon, c.name);
        } else {
            updateUI(55.75, 37.61, "Москва");
        }
    </script>
</body>
</html>
